name: Update Panic Dashboard

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install tushare pandas requests
        
    - name: Run panic monitor
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      run: |
        python -c 'import json,os; cfg=json.load(open("config.json")); cfg["tushare_token"]=os.environ["TUSHARE_TOKEN"]; cfg["feishu_webhook"]=os.environ["FEISHU_WEBHOOK"]; json.dump(cfg,open("config.json","w"),indent=2,ensure_ascii=False)'
        python panic_monitor.py
        
    - name: Commit and push
      run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add state.json history.json panic_dashboard_ghpages.html history_cache.json volume_cache.json
        git commit -m "Auto update - $(date +'%Y-%m-%d %H:%M')" || exit 0
        git push
