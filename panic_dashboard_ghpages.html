<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股恐慌看板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
  background: #0b0e14; color: #c5cdd9; min-height: 100vh; padding: 20px;
}
h1 { color: #e1e8f0; font-size: 1.4rem; margin-bottom: 4px; }
.subtitle { color: #6b7b8d; font-size: 0.85rem; margin-bottom: 20px; }

/* 网格 */
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.g2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }

/* 卡片 */
.card { background: #151922; border-radius: 12px; padding: 20px; border: 1px solid #1e2635; }
.card-title { color: #6b7b8d; font-size: 0.8rem; margin-bottom: 8px; }
.card-value { font-size: 2rem; font-weight: 700; }
.card-sub { color: #6b7b8d; font-size: 0.75rem; margin-top: 4px; }

/* 级别颜色 */
.level-0 { color: #6b7b8d; }
.level-1 { color: #f0b90b; }
.level-2 { color: #f57c00; }
.level-3 { color: #e53935; }

/* 条件面板 */
.cond-panel { background: #151922; border-radius: 12px; padding: 20px; border: 1px solid #1e2635; text-align: center; }
.cond-name { color: #6b7b8d; font-size: 0.8rem; margin-bottom: 8px; }
.cond-value { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
.cond-status { font-size: 0.85rem; margin-top: 6px; }
.cond-met { color: #4caf50; }
.cond-not-met { color: #f44336; }
.cond-bar-bg { background: #1e2635; border-radius: 4px; height: 8px; margin: 10px 0 4px; overflow: hidden; }
.cond-bar { height: 100%; border-radius: 4px; transition: width 0.5s; }
.cond-threshold { color: #6b7b8d; font-size: 0.7rem; margin-top: 2px; }

/* 信号记录 */
.signal-section { margin-bottom: 20px; }
.signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.signal-title { color: #e1e8f0; font-size: 1rem; font-weight: 600; }
.signal-count { color: #6b7b8d; font-size: 0.8rem; }

.signal-card {
  background: #151922; border-radius: 12px; padding: 16px 20px; margin-bottom: 12px;
  border: 1px solid #1e2635; display: flex; justify-content: space-between; align-items: center;
}
.signal-left { display: flex; align-items: center; gap: 16px; }
.signal-badge {
  padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
}
.badge-1 { background: rgba(240,185,11,0.15); color: #f0b90b; }
.badge-2 { background: rgba(245,124,0,0.15); color: #f57c00; }
.badge-3 { background: rgba(229,57,53,0.15); color: #e53935; }
.signal-date { color: #e1e8f0; font-size: 0.95rem; }
.signal-details { color: #6b7b8d; font-size: 0.8rem; margin-top: 2px; }
.signal-returns { display: flex; gap: 12px; font-size: 0.85rem; }
.ret-up { color: #4caf50; }
.ret-down { color: #e53935; }
.ret-na { color: #6b7b8d; }

.no-signal { color: #6b7b8d; text-align: center; padding: 40px; font-size: 0.9rem; }

/* 加载提示 */
.loading { text-align: center; padding: 60px; color: #6b7b8d; }
.error { text-align: center; padding: 60px; color: #e53935; }
</style>
</head>
<body>

<!-- 标题 -->
<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;">
  <div>
    <h1>📉 A股恐慌看板</h1>
    <div class="subtitle">实时监控市场恐慌情绪 · 数据更新时间：<span id="update-time">加载中...</span></div>
  </div>
</div>

<!-- 核心指标 -->
<div class="g3">
  <div class="card">
    <div class="card-title">当前恐慌级别</div>
    <div class="card-value level-0" id="panic-level-display">加载中</div>
    <div class="card-sub" id="panic-level-name">数据加载中</div>
  </div>
  <div class="card">
    <div class="card-title">沪深300涨跌幅</div>
    <div class="card-value" id="index-drop-display">--</div>
    <div class="card-sub" id="index-close">--</div>
  </div>
  <div class="card">
    <div class="card-title">全市场下跌比例</div>
    <div class="card-value" id="drop-ratio-display">--</div>
    <div class="card-sub">下跌个股 / 全部A股</div>
  </div>
</div>

<!-- 三大条件 -->
<div class="g3">
  <div class="cond-panel">
    <div class="cond-name">条件1 · 沪深300跌幅</div>
    <div class="cond-value" id="cond1-value">--</div>
    <div class="cond-bar-bg"><div class="cond-bar" id="cond1-bar" style="width:0%"></div></div>
    <div class="cond-threshold" id="cond1-threshold">阈值：>=2.5%（一级）/ >=3.0%（二级）/ >=4.0%（三级）</div>
    <div class="cond-status" id="cond1-status">等待数据...</div>
  </div>
  <div class="cond-panel">
    <div class="cond-name">条件2 · 量能比（当日/20日均值）</div>
    <div class="cond-value" id="cond2-value">--</div>
    <div class="cond-bar-bg"><div class="cond-bar" id="cond2-bar" style="width:0%"></div></div>
    <div class="cond-threshold" id="cond2-threshold">阈值：>=1.2x（放量下跌）</div>
    <div class="cond-status" id="cond2-status">等待数据...</div>
  </div>
  <div class="cond-panel">
    <div class="cond-name">条件3 · 全市场下跌比例</div>
    <div class="cond-value" id="cond3-value">--</div>
    <div class="cond-bar-bg"><div class="cond-bar" id="cond3-bar" style="width:0%"></div></div>
    <div class="cond-threshold" id="cond3-threshold">阈值：>=75%（普跌）</div>
    <div class="cond-status" id="cond3-status">等待数据...</div>
  </div>
</div>

<!-- 历史信号 -->
<div class="signal-section">
  <div class="signal-header">
    <div class="signal-title">⚡ 历史恐慌信号</div>
    <div class="signal-count" id="signal-count">加载中...</div>
  </div>
  <div id="signal-list"></div>
  <div class="no-signal" id="no-signal-msg" style="display:none;">暂无恐慌信号记录</div>
</div>

<!-- 加载中提示 -->
<div class="loading" id="loading-msg">正在加载数据...</div>

<script>
// 数据对象
let stateData = null;
let historyData = null;

// 加载数据
async function loadData() {
  try {
    // 加载 dashboard_data.json
    const stateResp = await fetch('dashboard_data.json?t=' + new Date().getTime());
    if (!stateResp.ok) throw new Error('无法加载 dashboard_data.json');
    stateData = await stateResp.json();
    
    // 加载 history.json
    const historyResp = await fetch('history.json?t=' + new Date().getTime());
    if (!historyResp.ok) throw new Error('无法加载 history.json');
    historyData = await historyResp.json();
    
    // 渲染数据
    renderDashboard();
    
    // 隐藏加载提示
    document.getElementById('loading-msg').style.display = 'none';
    
  } catch (error) {
    console.error('加载数据失败:', error);
    document.getElementById('loading-msg').innerHTML = 
      '<div class="error">❌ 数据加载失败<br><small>' + error.message + '</small></div>';
  }
}

// 渲染看板
function renderDashboard() {
  const s = stateData;
  const levelNames = { 0: '未触发', 1: '一级恐慌', 2: '二级恐慌', 3: '三级恐慌' };
  const levelColors = { 0: '#6b7b8d', 1: '#f0b90b', 2: '#f57c00', 3: '#e53935' };
  
  // 格式化日期 20260326 -> 2026-03-26
  function fmtDate(d) {
    if (!d || d.length !== 8) return d;
    return d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8);
  }
  
  // 收益样式
  function retClass(v) {
    if (v === null || v === undefined) return 'ret-na';
    return v >= 0 ? 'ret-up' : 'ret-down';
  }
  function retText(v) {
    if (v === null || v === undefined) return '--';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  }
  
  // ── 恐慌级别显示 ───────────────
  const elDisplay = document.getElementById('panic-level-display');
  const elName = document.getElementById('panic-level-name');
  elDisplay.textContent = levelNames[s.panicLevel] || '未触发';
  elDisplay.className = 'card-value level-' + s.panicLevel;
  elName.textContent = s.updateTime ? '更新: ' + s.updateTime : '数据加载中';
  document.getElementById('update-time').textContent = 
    '最后更新：' + (s.updateTime || '--') + (s.tradeDate ? '  |  交易日：' + fmtDate(s.tradeDate) : '');
  
  // ── KPI ────────────────────────
  const dropColor = s.indexDrop < 0 ? '#4caf50' : (s.indexDrop > 0 ? '#e53935' : '#6b7b8d');
  document.getElementById('index-drop-display').innerHTML = 
    '<span style="color:' + dropColor + '">' + (s.indexDrop < 0 ? '' : '+') + s.indexDrop.toFixed(2) + '%</span>';
  document.getElementById('index-close').textContent = 
    '收盘：' + (s.indexClose ? s.indexClose.toFixed(2) : '--');
  
  const ratioColor = s.dropRatio >= 75 ? '#e53935' : (s.dropRatio >= 50 ? '#f57c00' : '#4caf50');
  document.getElementById('drop-ratio-display').innerHTML = 
    '<span style="color:' + ratioColor + '">' + s.dropRatio.toFixed(1) + '%</span>';
  
  // ── 条件1：跌幅 ─────────────────
  const cond1Val = document.getElementById('cond1-value');
  const cond1Bar = document.getElementById('cond1-bar');
  const cond1Stat = document.getElementById('cond1-status');
  const cond1Thresh = document.getElementById('cond1-threshold');
  cond1Val.innerHTML = (s.indexDrop < 0 ? '' : '+') + s.indexDrop.toFixed(2) + '%';
  cond1Val.style.color = s.indexDrop <= -2.5 ? '#4caf50' : '#c5cdd9';
  const cond1Pct = Math.min(Math.abs(s.indexDrop) / 5 * 100, 100);
  cond1Bar.style.width = cond1Pct + '%';
  cond1Bar.style.background = s.indexDrop <= -2.5 ? '#4caf50' : '#6b7b8d';
  cond1Thresh.textContent = '阈值：>=2.5%（一级）/ >=3.0%（二级）/ >=4.0%（三级）';
  if (s.indexDrop <= -4.0) {
    cond1Stat.innerHTML = '<span class="cond-met">三级恐慌跌幅区间</span>';
  } else if (s.indexDrop <= -3.0) {
    cond1Stat.innerHTML = '<span class="cond-met">二级恐慌跌幅区间</span>';
  } else if (s.indexDrop <= -2.5) {
    cond1Stat.innerHTML = '<span class="cond-met">一级恐慌跌幅区间</span>';
  } else {
    cond1Stat.innerHTML = '<span class="cond-not-met">未达恐慌跌幅阈值</span>';
  }
  
  // ── 条件2：量比 ────────────────
  const cond2Val = document.getElementById('cond2-value');
  const cond2Bar = document.getElementById('cond2-bar');
  const cond2Stat = document.getElementById('cond2-status');
  const cond2Thresh = document.getElementById('cond2-threshold');
  cond2Val.textContent = s.volumeRatio.toFixed(2) + 'x';
  cond2Val.style.color = s.volumeRatio >= 1.2 ? '#4caf50' : '#c5cdd9';
  const cond2Pct = Math.min(s.volumeRatio / 3 * 100, 100);
  cond2Bar.style.width = cond2Pct + '%';
  cond2Bar.style.background = s.volumeRatio >= 1.2 ? '#4caf50' : '#6b7b8d';
  cond2Thresh.textContent = '阈值：>=1.2x（放量下跌）';
  if (s.volumeRatio >= 1.2) {
    cond2Stat.innerHTML = '<span class="cond-met">量能放大，满足条件</span>';
  } else {
    cond2Stat.innerHTML = '<span class="cond-not-met">量能未放大，不满足条件</span>';
  }
  
  // ── 条件3：下跌比例 ─────────────
  const cond3Val = document.getElementById('cond3-value');
  const cond3Bar = document.getElementById('cond3-bar');
  const cond3Stat = document.getElementById('cond3-status');
  const cond3Thresh = document.getElementById('cond3-threshold');
  cond3Val.textContent = s.dropRatio.toFixed(1) + '%';
  cond3Val.style.color = s.dropRatio >= 75 ? '#4caf50' : '#c5cdd9';
  const cond3Pct = Math.min(s.dropRatio, 100);
  cond3Bar.style.width = cond3Pct + '%';
  cond3Bar.style.background = s.dropRatio >= 75 ? '#4caf50' : '#6b7b8d';
  cond3Thresh.textContent = '阈值：>=75%（普跌）';
  if (s.dropRatio >= 75) {
    cond3Stat.innerHTML = '<span class="cond-met">全市场普跌，满足条件</span>';
  } else {
    cond3Stat.innerHTML = '<span class="cond-not-met">未达普跌阈值，不满足条件</span>';
  }
  
  // ── 历史信号 ───────────────────
  const signalList = document.getElementById('signal-list');
  const noSignal = document.getElementById('no-signal-msg');
  const signalCount = document.getElementById('signal-count');
  
  const alerts = s.alertHistory || [];
  signalCount.textContent = '共 ' + alerts.length + ' 次信号';
  
  if (alerts.length === 0) {
    noSignal.style.display = 'block';
    signalList.innerHTML = '';
  } else {
    noSignal.style.display = 'none';
    let html = '';
    alerts.forEach(function(a) {
      const badgeClass = 'badge-' + a.level;
      const levelText = levelNames[a.level] || '未知';
      
      html += '<div class="signal-card">' +
        '<div class="signal-left">' +
          '<span class="signal-badge ' + badgeClass + '">' + levelText + '</span>' +
          '<div>' +
            '<div class="signal-date">' + fmtDate(a.date) + '</div>' +
            '<div class="signal-details">跌幅 ' + a.drop_pct.toFixed(2) + '% · 量比 ' + a.volume_ratio.toFixed(2) + 'x · 下跌比例 ' + a.market_drop_ratio.toFixed(1) + '%</div>' +
          '</div>' +
        '</div>' +
        '<div class="signal-returns">' +
          '<span class="' + retClass(a.return_5d) + '">5日: ' + retText(a.return_5d) + '</span>' +
          '<span class="' + retClass(a.return_20d) + '">20日: ' + retText(a.return_20d) + '</span>' +
          '<span class="' + retClass(a.return_60d) + '">60日: ' + retText(a.return_60d) + '</span>' +
        '</div>' +
      '</div>';
    });
    signalList.innerHTML = html;
  }
}

// 页面加载时执行
loadData();

// 每5分钟自动刷新数据
setInterval(function() {
  loadData();
}, 5 * 60 * 1000);
</script>

</body>
</html>
